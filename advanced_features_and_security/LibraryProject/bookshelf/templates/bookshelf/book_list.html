<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
    <h1>Library Books</h1>

    <!-- Search form -->
    <form method="GET" action="">
        {% csrf_token %}
        <input type="text" name="q" placeholder="Search books..." value="{{ request.GET.q }}">
        <button type="submit">Search</button>
    </form>

    <hr>

    <!-- Book list -->
    {% if books %}
        <ul>
            {% for book in books %}
                <li>
                    <strong>{{ book.title|escape }}</strong> by {{ book.author|escape }}
                    <p>{{ book.description|default:"No description"|escape }}</p>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No books found.</p>
    {% endif %}

    <hr>

    <a href="{% url 'create_book' %}">Add a new book</a>
</body>
</html>
